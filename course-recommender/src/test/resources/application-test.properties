# MySQL Database Connection for Integration Tests
# Point to the new dedicated test database
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/coursesdbtest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration for Integration Tests

# 'create-drop' will drop the schema and recreate it before each test context load
spring.jpa.hibernate.ddl-auto=create-drop

# Ensures schema.sql/data.sql are run
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: Disable Open-In-View for tests to avoid potential issues
spring.jpa.open-in-view=false

# Logging for tests
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
